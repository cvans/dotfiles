# Umbriel configuration (managed by chezmoi)
#
# Based on the packaged example (/usr/share/umbriel/config.toml). Compare
# against it after Umbriel upgrades:
#   diff /usr/share/umbriel/config.toml ~/.config/umbriel/config.toml
# Validate edits with: umbriel config validate
# Reference: https://docs.noctalia.dev/umbriel/

# ==============================================================================
# Includes
# Noctalia's Umbriel template renders colors into noctalia.toml (enable it in
# ~/.config/noctalia/config.toml or Settings → Templates → Compositors). It is
# listed here up front so Noctalia never has to rewrite this managed file.
[include]
files = []

[include.optional]
files = ["noctalia.toml"]

# ==============================================================================
# General
[general]
mod_key = "Super"
# fcitx5 is started here instead of via XDG autostart so it is up before
# the first text field appears. The Vicinae server stays resident so
# `vicinae toggle` opens instantly.
autostart = ["noctalia", "fcitx5 -d --replace", "vicinae server --replace"]

# ==============================================================================
# Environment
# Input method on Wayland (fcitx5 + text-input-v3 / input-method-v2):
# GTK and Chromium/Electron use text-input-v3 natively, so GTK_IM_MODULE is
# deliberately NOT set. https://fcitx-im.org/wiki/Using_Fcitx_5_on_Wayland
[environment]
XMODIFIERS = "@im=fcitx"
QT_IM_MODULES = "wayland;fcitx"
SDL_IM_MODULE = "fcitx"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
TERMINAL = "ghostty"
EDITOR = "nvim"

# ==============================================================================
# Appearance (Noctalia's recommended values)
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 8

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# ==============================================================================
# Input
# English + Spanish: US with AltGr dead keys (AltGr+n = ñ, AltGr+' = á, …).
# Japanese is handled by fcitx5 + Mozc (toggle with Ctrl+Space by default).
[input.keyboard]
layout = "us"
variant = "altgr-intl"
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true

# ==============================================================================
# Keybinds
# Defining this table replaces Umbriel's built-in set, so every bind that
# should remain available is listed here.
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications (carried over from the Hyprland setup)
"Mod+Return" = { action = "spawn ghostty", repeat = false }
"Mod+B" = { action = "spawn helium-browser", repeat = false }
"Mod+Shift+B" = { action = "spawn helium-browser --incognito", repeat = false }
"Mod+A" = { action = "spawn anki", repeat = false }
"Mod+E" = { action = "spawn nautilus --new-window", repeat = false }
"Mod+Shift+N" = { action = "spawn ghostty -e nvim", repeat = false }
"Mod+Shift+Slash" = { action = "spawn 1password", repeat = false }

# Launcher: Vicinae (https://docs.vicinae.com). Noctalia's launcher stays
# available on Mod+Ctrl+L.
"Mod" = "spawn vicinae toggle"
"Mod+Ctrl+L" = "spawn noctalia msg panel-toggle launcher"

# Noctalia shell
"Mod+S" = "spawn noctalia msg panel-toggle control-center"
"Mod+Ctrl+S" = "spawn noctalia msg settings-toggle"
"Alt+Tab" = "spawn noctalia msg window-switcher hold"
"Alt+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"

# Screenshots and OCR
"Print" = "spawn noctalia msg screenshot-region"
"Mod+Shift+A" = "spawn noctalia msg screenshot-annotate"
"Mod+Ctrl+A" = "spawn noctalia msg annotate"
# Japanese/English OCR via the Screen Toolkit plugin (alexander/screen-toolkit).
"Mod+Shift+Print" = { action = "spawn noctalia msg plugin alexander/screen-toolkit:service all ocr", repeat = false }
# Fallback for keyboards without a Print key.
"Mod+Shift+O" = { action = "spawn noctalia msg plugin alexander/screen-toolkit:service all ocr", repeat = false }

# Session
"Mod+W" = { action = "window-close", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Media, volume and brightness keys, routed through Noctalia for OSDs.
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus (vim keys + arrows)
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+F1" = "window-focus-next"

# Move / swap windows
"Mod+Shift+H" = "window-swap-left"
"Mod+Shift+J" = "window-swap-down"
"Mod+Shift+K" = "window-swap-up"
"Mod+Shift+L" = "window-swap-right"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Alt+H" = "window-consume-or-expel-left"
"Mod+Shift+Alt+L" = "window-consume-or-expel-right"

# Window state
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }

# Layout (default is dwindle, as in Hyprland; Mod+D / Mod+Shift+D switch)
"Mod+D" = "workspace-set-layout scrolling"
"Mod+Shift+D" = "workspace-set-layout dwindle"
"Mod+Alt+T" = "layout-toggle-split"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Minus" = "window-modify-primary-extent -0.02"
"Mod+Equal" = "window-modify-primary-extent +0.02"
"Mod+Ctrl+Minus" = "window-modify-secondary-extent -0.02"
"Mod+Ctrl+Equal" = "window-modify-secondary-extent +0.02"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# Workspaces
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"
"Mod+Tab" = "workspace-focus-last"

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }

# Cheatsheet of all binds
"Mod+Slash" = "cheatsheet-toggle"

# ==============================================================================
# Layout
[layout]
mode = "dwindle"
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Window rules
[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Small utility windows float.
[[window_rule]]
match.app_id = "^(org.fcitx.fcitx5-config-qt|fcitx5-config-qt|org.pulseaudio.pavucontrol|com.github.tchx84.Flatseal)$"
default_floating = true

# VM consoles may grab all shortcuts (keyboard inhibit); Mod+Shift+Escape
# toggles that off. Uncomment to always keep compositor binds instead:
# [[window_rule]]
# match.app_id = "^virt-manager$"
# allow_shortcuts_inhibit = false

# ==============================================================================
# Layer rules
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# Vicinae: blur behind its layer-shell window and dim the output below it.
[[layer_rule]]
match.namespace = "^vicinae$"
blur = true
dim_behind = 0.3

# ==============================================================================
# Overview
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
